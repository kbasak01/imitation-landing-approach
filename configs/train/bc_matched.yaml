arm: bc_matched                 # the data-matched control for bc_dagger (and the 2x-data reference)
data: {collection: ppo_2000, first_n: 2000}
schedule:                       # P3-D1 §3: follows bc_dagger's schedule exactly, so H1 differs only in who chose the actions
  iteration_0: reuse_bc_seed_run   # the `bc` run of the same seed (30 000 steps, demos 0-999), its last-step EMA; shared with bc_dagger
  iterations: {n: 5, add_episodes_per_iteration: 200, first_added: 1000, steps_per_iteration: 10000, warm_start: true}
  # iteration i adds teacher demos 1000+200(i-1) .. 1000+200i-1
  loop:                         # identical to bc_dagger.yaml `loop` (the keys that apply without rollouts)
    warm_start: {weights: true, ema: true, optimizer_state: false}
    schedule_per_iteration: {name: cosine, warmup_steps: 500, steps: 10000}
    sampling: uniform_over_aggregate_frames
success_filter: true    # P3-D1 §2: only `success` episodes; kept fraction reported
encoder: {trunk: resnet18, pretrained: false, norm: groupnorm, groups: 16, spatial_softmax_keypoints: 32}
proprio_mlp: [64, 64]
augment: {crop: {size: 88, train: random, eval: center}}   # 96 -> 88 px; P3-D1 §3
head: {hidden: [256, 256], out: 3, activation: tanh}
loss: mse
optim: {name: adamw, lr: 3.0e-4, weight_decay: 1.0e-4, schedule: cosine, warmup_steps: 500}
steps: 30000                    # iteration 0; total 80 000 with the five 10 000-step iterations
batch_size: 256
precision: bf16
ema: 0.999
checkpoint_every: 5000
selection: {list: select, metric: success, tie_break: [p95_closing_speed, lowest_step], when: after_final_iteration, candidates: final_iteration_checkpoints, weights: ema}
seeds: [0, 1, 2, 3, 4]
