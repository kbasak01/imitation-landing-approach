# Demo collection. Train pool only (P8 dev_pool train, 729 realizations). Generator seed fixed here.
generator_seed: 20261023
pool: train
stratify_by: [ss]            # SS3, SS4, SS5 in equal shares; headings/speeds dealt round-robin
select_list: {pool: tune, per_ss: 50, sea_states: [SS3, SS4, SS5]}   # 150 episodes -> splits/select.parquet
# Every demo collection flies a prefix of ONE train stream (ila.data.episodes): ppo_2000 = global
# indices 0-1999 (splits/demos_0-1999.parquet); pid_1000, mix_1000 and each DART sigma set =
# indices 0-999 (splits/demos_0-999.parquet), i.e. the same 1 000 episodes as the `bc` set.
# DAgger rollouts fly indices 1000-1999 of the same stream (see dagger), so bc_dagger and
# bc_matched share the identical 2 000 starting conditions (P3-D1 decision, 2026-10-27).
demo_stream: demos
teachers:
  T_ppo: {source: p8_ppo, seed: 0, label_path: sb3}     # P2-D1: collection flies and labels on SB3
  T_pid: {source: p8_controller, name: pid_feedforward}
  # Balanced per sea state (P3-D1 decision, 2026-10-27; ila.data.mix): within each SS cell a
  # seeded permutation gives exactly half the episodes to ppo, half to gated; an odd cell's
  # extra episode goes to ppo in the 1st, 3rd, ... odd cell and to gated in the 2nd, 4th, ...
  T_mix: {mixture: {T_ppo: 0.5, gated: 0.5}, draw: balanced_per_ss, seed: 20261023}
collections:
  ppo_2000: {teacher: T_ppo, n: 2000}      # first 1000 = `bc`/`dp` set; all 2000 = `bc_matched`
  pid_1000: {teacher: T_pid, n: 1000}
  mix_1000: {teacher: T_mix, n: 1000}
  # normalised action units, Gaussian on the EXECUTED action only; label = clean teacher action.
  # Per-episode noise generator seeded by (seed, episode position, episode seed), not by sigma:
  # the three sigma sets share their standard-normal draws (common random numbers).
  dart: {teacher: T_ppo, n: 1000, sigma_grid: [0.05, 0.10, 0.20], seed: 20261023}
success_filter_for_bc: true   # kept fraction reported; DAgger rollouts are never filtered
dagger:
  iterations: 5
  episodes_per_iteration: 200
  beta: [0.5, 0.25, 0.125, 0.0, 0.0]   # prob. of executing the teacher's action per step, iterations 1..5
  warm_start: true
  steps_per_iteration: 10000
  # Iteration i (1..5) flies demos global indices first_index + 200 (i-1) .. first_index + 200 i - 1
  # (rows 1000-1999 of splits/demos_0-1999.parquet), the SAME rows for every student seed.
  stream: demos
  first_index: 1000
