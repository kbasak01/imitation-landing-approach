# CPU CI (REPO_SETUP.md §7). Tests that need a GPU, P8's gitignored checkpoints, the demo store,
# or a long run are deselected; they run on the workstation.
name: ci

on:
  push:
    branches: [main, "phase-*"]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      P8: external/rl-land-on-moving-deck
    steps:
      # P8's pins pull CUDA torch and TensorRT wheels; with the restored pip cache the runner's
      # ~14 GB free disk ran out (Errno 28, Gate 1 incident; again on 2026-11-05, run 41966956963,
      # where the runner itself hit ENOSPC after the tests passed). Drop toolchains and images
      # this job never uses; keep /opt/hostedtoolcache/Python for setup-python.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /usr/local/share/powershell /usr/share/swift \
            /usr/local/lib/node_modules /usr/local/julia* /opt/microsoft /opt/google \
            /opt/az /usr/share/miniconda /usr/local/share/chromium
          sudo find /opt/hostedtoolcache -mindepth 1 -maxdepth 1 ! -name Python \
            -exec rm -rf {} +
          sudo docker image prune --all --force > /dev/null || true
          df -h /
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            external/rl-land-on-moving-deck/pyproject.toml
      - name: System packages (pybullet builds from sdist on 3.12)
        run: sudo apt-get update && sudo apt-get install -y build-essential python3.12-dev
      - name: Install P8 (its exact pins), then this repo
        run: |
          python -m pip install -U pip
          pip install -e $P8/third_party/deck-motion-forecast
          pip install -e $P8/third_party/gym-pybullet-drones
          pip install -e "$P8[dev]"
          pip freeze --exclude-editable > /tmp/p8_constraints.txt
          pip install -c /tmp/p8_constraints.txt -e ".[dev]"
          python -c "import rld, ila"
      # On a cache hit the restored wheels are now duplicated in site-packages and setup-python
      # will not re-save the cache, so the copy is dead weight (several GB of CUDA wheels). On a
      # miss keep it: setup-python's post step saves it for the next run.
      - name: Drop the restored pip cache (cache hit only)
        if: steps.setup-python.outputs.cache-hit == 'true'
        run: |
          pip cache purge
          df -h /
      - name: Lint
        run: make lint PY=python RUFF=ruff MYPY=mypy PYTEST=pytest
      - name: Test (CPU subset)
        run: pytest -m "not gpu and not checkpoints and not data and not slow"
      # Results re-render from committed files only (no checkpoints, no demo store, no
      # paths.local.yaml): results.md, the Phase 9 latency tables and the figures must come out
      # byte-identical on a fresh clone (Phase 10, P10-D1; VALIDATION_CHECKLIST F8).
      - name: Report re-renders byte-identically
        run: make report PY=python
      - name: Latency tables re-render byte-identically (bench --check)
        run: make bench-check PY=python
      - name: Figures re-render byte-identically
        run: make figures PY=python && git diff --exit-code results/e08/figures
      - name: Disk after tests
        if: always()
        run: df -h /
